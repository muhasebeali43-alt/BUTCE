<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CepteBütçe - Tam Senkron v55</title>
    <!-- Cüzdan Simge (Favicon & Mobil App Icon) -->

<body class="flex justify-center items-center min-h-[100dvh] bg-[#0b0b0e] p-0 sm:p-4">
    
    <!-- Responsive Ana Konteyner -->
    <div class="w-full h-[100dvh] sm:h-[90vh] sm:max-w-4xl bg-[#0f0f12] sm:rounded-[32px] sm:border sm:border-zinc-800 flex flex-col relative overflow-hidden shadow-2xl">
        
        <!-- Şifre Kilit Ekranı -->
        <div id="lock-screen" class="absolute inset-0 bg-[#0f0f12] z-50 flex flex-col justify-center items-center p-6 space-y-6 hidden">
            <div class="w-16 h-16 rounded-3xl bg-[#ccff00]/10 text-[#ccff00] flex items-center justify-center text-3xl font-bold">🔒</div>
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold text-white">CepteBütçe Kilitli</h2>
                <p class="text-xs text-zinc-400">Devam etmek için şifrenizi girin</p>
            </div>
            <div class="w-full max-w-xs space-y-3">
                <input type="password" id="unlock-pin" placeholder="••••" maxlength="6" onkeydown="if(event.key==='Enter') tryUnlock()" class="w-full bg-[#18181c] border border-zinc-800 rounded-2xl p-4 text-center text-white text-xl tracking-widest outline-none focus:border-[#ccff00]">
                <button onclick="tryUnlock()" class="w-full bg-[#ccff00] hover:bg-[#b3e600] text-black font-bold py-4 rounded-2xl text-sm transition shadow-lg shadow-[#ccff00]/10">Giriş Yap</button>
            </div>
        </div>

        <!-- Üst Ay Seçim Barı -->
        <div class="px-4 sm:px-6 pt-3.5 pb-3 flex justify-between items-center bg-[#0f0f12] z-20 border-b border-zinc-800/40">
            <div class="flex items-center space-x-2">
                <div class="w-2.5 h-2.5 rounded-full bg-[#ccff00]"></div>
                <span class="text-xs sm:text-sm font-extrabold tracking-wide text-white">CepteBütçe</span>
                <span id="sync-status" class="text-[9px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 transition">Canlı Bağlı</span>
            </div>
            <div class="flex items-center space-x-2">
                <div id="top-lock-btn-container"></div>
                <div class="flex items-center space-x-2.5 bg-[#18181c] px-3 py-1.5 rounded-2xl border border-zinc-800">
                    <button onclick="prevMonth()" class="w-6 h-6 rounded-xl bg-zinc-800/60 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center font-bold transition text-xs">◀</button>
                    <div id="month-display" class="text-xs font-extrabold text-[#ccff00] tracking-wide min-w-[85px] text-center">Eylül 2026</div>
                    <button onclick="nextMonth()" class="w-6 h-6 rounded-xl bg-zinc-800/60 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center font-bold transition text-xs">▶</button>
                </div>
            </div>
        </div>

        <!-- İçerik Alanı -->
        <div id="app-view" class="flex-1 overflow-y-auto no-scrollbar pb-24 px-4 sm:px-8 pt-4 sm:pt-6">
            <!-- Dinamik doldurulacak -->
        </div>

        <!-- Alt Navigasyon Barı -->
        <div class="absolute bottom-0 left-0 right-0 bg-[#121216]/95 backdrop-blur-md border-t border-zinc-800/80 px-4 py-2.5 flex justify-between items-center z-30 sm:rounded-b-[32px]">
            <button onclick="changeTab('home')" id="tab-home" class="flex flex-col items-center space-y-0.5 text-[#ccff00] transition flex-1">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="text-[10px] font-semibold">Ana Sayfa</span>
            </button>
            <button onclick="changeTab('income')" id="tab-income" class="flex flex-col items-center space-y-0.5 text-zinc-500 hover:text-zinc-300 transition flex-1">

            <button onclick="changeTab('expense')" id="tab-expense" class="flex flex-col items-center space-y-0.5 text-zinc-500 hover:text-zinc-300 transition flex-1">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20V4m0 16l-4-4m4 4l4-4"></path></svg>
                <span class="text-[10px] font-semibold">Giderler</span>
            </button>
            <button onclick="changeTab('fund')" id="tab-fund" class="flex flex-col items-center space-y-0.5 text-zinc-500 hover:text-zinc-300 transition flex-1">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                <span class="text-[10px] font-medium">Fonlarım</span>
            </button>
            <button onclick="changeTab('settings')" id="tab-settings" class="flex flex-col items-center space-y-0.5 text-zinc-500 hover:text-zinc-300 transition flex-1">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756.2924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[10px] font-medium">Ayarlar</span>
            </button>
        </div>
    </div>

    <!-- Genel İşlem Ekleme / Düzenleme Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
        <div class="bg-[#18181c] w-full max-w-md rounded-3xl border border-zinc-800 p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 id="modal-title" class="text-base font-bold text-white">İşlem Ekle</h3>
                <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white text-xs">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">İşlem / Kalem Adı</label>
                    <input type="text" id="m-name" placeholder="Örn: Maaş, Kira..." class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-3 text-white text-xs outline-none focus:border-[#ccff00]">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">Tutar (₺)</label>
                    <input type="number" id="m-amount" placeholder="0" class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-3 text-white text-xs outline-none focus:border-[#ccff00]">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">Kategori / Tür</label>
                    <select id="m-cat" class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-3 text-white text-xs outline-none focus:border-[#ccff00]">
                        <!-- Dinamik doldurulacak -->
                    </select>
                </div>
                <button onclick="saveModalData()" class="w-full bg-[#ccff00] hover:bg-[#b3e600] text-black font-bold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-[#ccff00]/10">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Başlangıç Fon Değeri (Anapara) Düzenleme Modal -->
    <div id="principal-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
        <div class="bg-[#18181c] w-full max-w-md rounded-3xl border border-zinc-800 p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-white">Başlangıç Fon Değeri (Anapara)</h3>
                <button onclick="closePrincipalModal()" class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white text-xs">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">Başlangıç Anapara Tutarı (₺)</label>
                    <input type="number" id="p-amount" placeholder="0" class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-3 text-white text-xs outline-none focus:border-[#8b5cf6]">
                </div>
                <button onclick="savePrincipal()" class="w-full bg-[#8b5cf6] hover:bg-[#7c3aed] text-white font-bold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-[#8b5cf6]/20">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Fon Güncel Bakiye Ekleme / Güncelleme Modal -->
    <div id="fund-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
        <div class="bg-[#18181c] w-full max-w-md rounded-3xl border border-zinc-800 p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-white">Fon Güncel Bakiye Ekle</h3>
                <button onclick="closeFundModal()" class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white text-xs">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">Tarih</label>
                    <input type="date" id="f-date" class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-3 text-white text-xs outline-none focus:border-[#8b5cf6]">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">Güncel Fon Bakiyesi (₺)</label>
                    <input type="number" id="f-balance" placeholder="0" class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-3 text-white text-xs outline-none focus:border-[#8b5cf6]">
                </div>
                <button onclick="saveFundBalance()" class="w-full bg-[#8b5cf6] hover:bg-[#7c3aed] text-white font-bold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-[#8b5cf6]/20">Kaydet / Ekle</button>
            </div>
        </div>
    </div>

    <!-- Tüm Dönem Hareketleri Yönetim Modal -->
    <div id="log-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
        <div class="bg-[#18181c] w-full max-w-lg h-[520px] rounded-3xl border border-zinc-800 p-5 flex flex-col space-y-3 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-white">Dönem Hareketleri Yönetimi</h3>
                <button onclick="closeLogModal()" class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white text-xs">✕</button>
            </div>
            <div>
                <label class="text-[10px] text-zinc-400 font-semibold mb-1 block">Görüntülenecek Ay / Dönem</label>
                <select id="modal-month-select" onchange="changeModalMonth(this.value)" class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-2.5 text-white text-xs outline-none focus:border-[#ccff00]">
                    <!-- Dinamik doldurulacak -->
                </select>
            </div>
            <div id="log-list" class="flex-1 overflow-y-auto no-scrollbar space-y-2">
                <!-- Hareketler -->
            </div>
        </div>
    </div>

    <script>
        let defaultTransactions = [
            { id: 201, name: "Maaş 1", amount: 35000, type: "Gelir", category: "Gelir", date: "Ekim 2026" },
            { id: 202, name: "Maaş 2", amount: 45000, type: "Gelir", category: "Gelir", date: "Ekim 2026" },
            { id: 203, name: "Nejat", amount: 1200, type: "Gelir", category: "Gelir", date: "Ekim 2026" },
            { id: 204, name: "Kira", amount: 15000, type: "Gider", category: "Gider", date: "Ekim 2026" },
            { id: 206, name: "TEB Kredi", amount: 10000, type: "Gider", category: "Gider", date: "Ekim 2026" },
            { id: 207, name: "YKB Kredi", amount: 15000, type: "Gider", category: "Gider", date: "Ekim 2026" },
            { id: 208, name: "Enpara Kredi", amount: 20000, type: "Gider", category: "Gider", date: "Ekim 2026" }
        ];

        let savedData = null;
        const keysToCheck = ['cep_butce_excel_v55', 'cep_butce_excel_v54', 'cep_butce_excel_v53', 'cep_butce_excel_v52', 'cep_butce_excel_v51'];
        for (let k of keysToCheck) {
            let data = localStorage.getItem(k);
            if (data) {
                try {
                    let parsed = JSON.parse(data);
                    if(parsed && parsed.transactions) {
                        parsed.transactions = parsed.transactions.filter(t => t.id > 2000);
                        savedData = parsed;
                        break;
                    }
                } catch(e){}
            }
        }

        let state = savedData || {
            transactions: defaultTransactions,
            funds: { currentBalance: 762000, principal: 0, history: [{ id: Date.now(), date: "2026-09-24", balance: 762000 }] },
            pin: "",
            lastUpdated: Date.now()
        };

        if(!state.funds) {
            state.funds = { currentBalance: 762000, principal: 0, history: [] };
        }
        if(state.funds.principal === undefined) state.funds.principal = 0;
        if(!state.funds.history) state.funds.history = [];
        if(state.funds.history.length === 0) {
            state.funds.history.push({
                id: Date.now(),
                date: "2026-09-24",
                balance: state.funds.currentBalance || 762000
            });
        }

        if(state.funds.history.length > 0) {
            state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
            state.funds.currentBalance = state.funds.history[state.funds.history.length - 1].balance;
        }

        if(!state.lastUpdated) state.lastUpdated = Date.now();

        // Firebase Firestore Otomatik Entegrasyonu (v55)
        const firebaseConfig = {
            apiKey: "AIzaSyCLxx02KpBH2MFGXEePIb-w79FVwOBW4GQ",
            authDomain: "butce-24f0f.firebaseapp.com",
            projectId: "butce-24f0f",
            storageBucket: "butce-24f0f.appspot.com",
            messagingSenderId: "202707791257",
            appId: "1:202707791257:web:694f4e63831630e0eab708"
        };

        let db = null;
        let isSyncingFromCloud = false;
        let inactivityTimer = null;
        const INACTIVITY_TIME = 3 * 60 * 1000; // 3 Dakika

        function resetInactivityTimer() {
            if (!state.pin || !sessionStorage.getItem('cep_unlocked')) return;
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                lockApp();
            }, INACTIVITY_TIME);
        }

        ['mousemove', 'mousedown', 'keypress', 'touchstart', 'scroll', 'click'].forEach(evt => {
            window.addEventListener(evt, resetInactivityTimer, true);
        });

        function checkLock() {
            let lockScreen = document.getElementById('lock-screen');
            if(!lockScreen) return;
            if(state.pin && !sessionStorage.getItem('cep_unlocked')) {
                lockScreen.classList.remove('hidden');
                lockScreen.style.display = 'flex';
                clearTimeout(inactivityTimer);
            } else {
                lockScreen.classList.add('hidden');
                lockScreen.style.display = 'none';
                resetInactivityTimer();
            }
            updateTopLockBtn();
        }

        function lockApp() {
            sessionStorage.removeItem('cep_unlocked');
            clearTimeout(inactivityTimer);
            checkLock();
        }

        function updateTopLockBtn() {
            let container = document.getElementById('top-lock-btn-container');
            if(!container) return;
            if(state.pin) {
                container.innerHTML = `
                    <button onclick="lockApp()" class="hidden sm:flex items-center space-x-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-3 py-1.5 rounded-2xl border border-amber-500/20 text-xs font-bold transition shadow-sm" title="Kilitle / Çıkış Yap">
                        <span>🔒 Kilitle</span>
                    </button>
                `;
            } else {
                container.innerHTML = '';
            }
        }

        function initFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                
                db.collection("cepButce").doc("anaVeri").get().then((doc) => {
                    if (doc.exists) {
                        let cloudData = doc.data();
                        if (cloudData && cloudData.transactions) {
                            cloudData.transactions = cloudData.transactions.filter(t => t.id > 2000);
                            state = cloudData;
                            if(!state.funds) state.funds = { currentBalance: 762000, principal: 0, history: [] };
                            if(state.funds.principal === undefined) state.funds.principal = 0;
                            if(!state.funds.history) state.funds.history = [];
                            if(state.funds.history.length === 0) {
                                state.funds.history.push({
                                    id: Date.now(),
                                    date: "2026-09-24",
                                    balance: state.funds.currentBalance || 762000
                                });
                            }
                            if(state.funds.history.length > 0) {
                                state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
                                state.funds.currentBalance = state.funds.history[state.funds.history.length - 1].balance;
                            }
                            localStorage.setItem('cep_butce_excel_v55', JSON.stringify(state));
                            checkLock();
                            renderView();
                        }
                    } else {
                        db.collection("cepButce").doc("anaVeri").set(state);
                    }
                }).catch(e => {});

                db.collection("cepButce").doc("anaVeri").onSnapshot((doc) => {
                    let statusEl = document.getElementById('sync-status');
                    if (doc.exists) {
                        let cloudData = doc.data();
                        if (statusEl) {
                            statusEl.innerText = "Canlı Bağlı";
                            statusEl.className = "text-[9px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 transition";
                        }
                        if (cloudData && cloudData.transactions) {
                            isSyncingFromCloud = true;
                            cloudData.transactions = cloudData.transactions.filter(t => t.id > 2000);
                            state = cloudData;
                            if(!state.funds) state.funds = { currentBalance: 762000, principal: 0, history: [] };
                            if(state.funds.principal === undefined) state.funds.principal = 0;
                            if(!state.funds.history) state.funds.history = [];
                            if(state.funds.history.length === 0) {
                                state.funds.history.push({
                                    id: Date.now(),
                                    date: "2026-09-24",
                                    balance: state.funds.currentBalance || 762000
                                });
                            }
                            if(state.funds.history.length > 0) {
                                state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
                                state.funds.currentBalance = state.funds.history[state.funds.history.length - 1].balance;
                            }
                            localStorage.setItem('cep_butce_excel_v55', JSON.stringify(state));
                            checkLock();
                            renderView();
                            isSyncingFromCloud = false;
                        }
                    }
                }, (error) => {
                    let statusEl = document.getElementById('sync-status');
                    if(statusEl) {

        let activeMonthIndex = 8; // Eylül (2026)

        function initSwipeGestures() {
            let appView = document.getElementById('app-view');
            if(!appView || appView.dataset.swipeInit === 'true') return;
            appView.dataset.swipeInit = 'true';

            appView.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            appView.addEventListener('touchend', (e) => {
                let touchEndX = e.changedTouches[0].screenX;
                let touchEndY = e.changedTouches[0].screenY;
                let diffX = touchEndX - touchStartX;
                let diffY = touchEndY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                    let currentIndex = tabOrder.indexOf(currentTab);
                    if (diffX > 0 && currentIndex > 0) {
                        changeTab(tabOrder[currentIndex - 1]);
                    } else if (diffX < 0 && currentIndex < tabOrder.length - 1) {
                        changeTab(tabOrder[currentIndex + 1]);
                    }
                }
            }, { passive: true });
        }

        function parseMonthYear(myStr) {
            let parts = myStr.split(' ');
            let mName = parts[0];
            let year = parseInt(parts[1]) || 2026;
            let mIndex = months.indexOf(mName);
            return year * 12 + mIndex;
        }

        function getChronologicalMonths() {
            let monthsSet = new Set(state.transactions.map(t => t.date));
            monthsSet.add(getActiveMonthString());
            let arr = Array.from(monthsSet);
            arr.sort((a, b) => parseMonthYear(a) - parseMonthYear(b));
            return arr;
        }

        function calculateMonthFinancials(targetMonthStr) {
            let chronoMonths = getChronologicalMonths();
            let targetIndex = chronoMonths.indexOf(targetMonthStr);
            
            let devredenBakiye = 0;
            let buAyGelir = 0;
            let buAyGider = 0;
            
            let runningBalance = 0;
            for (let i = 0; i <= targetIndex; i++) {
                let mStr = chronoMonths[i];
                let mTx = state.transactions.filter(t => t.date === mStr);
                let g = mTx.filter(t => t.type === 'Gelir').reduce((a, b) => a + b.amount, 0);
                let d = mTx.filter(t => t.type === 'Gider').reduce((a, b) => a + b.amount, 0);
                let mNet = g - d;
                
                if (i < targetIndex) {
                    runningBalance += mNet;
                } else {
                    devredenBakiye = runningBalance;
                    buAyGelir = g;
                    buAyGider = d;
                }
            }
            
            let toplamBakiye = devredenBakiye + buAyGelir - buAyGider;
            return { devredenBakiye, buAyGelir, buAyGider, toplamBakiye };
        }

        function formatDateToMonthStr(dateStr) {
            let parts = dateStr.split('-');
            if(parts.length === 3) {
                let year = parseInt(parts[0]);
                let mIndex = parseInt(parts[1]) - 1;
                if(months[mIndex]) {
                    return `${months[mIndex]} ${year}`;
                }
            }
            return dateStr;
        }

                            <div class="flex justify-between items-center py-2">
                                <span class="text-sm font-medium text-white">Tablo Verilerini Sıfırla</span>
                                <button onclick="resetData()" class="bg-red-500/10 text-red-400 text-xs font-bold px-4 py-2.5 rounded-xl">Sıfırla</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            initSwipeGestures();
        }

        function savePinSetting() {
            let val = document.getElementById('setting-pin').value;
            if(!val) { alert('Lütfen bir şifre girin.'); return; }
            state.pin = val;
            saveState();
            alert('Şifre başarıyla kaydedildi!');
            renderView();
            checkLock();
        }

        function removePin() {
            if(confirm("Uygulama şifresi kaldırılsın mı?")) {
                state.pin = "";
                saveState();
                alert('Şifre kaldırıldı.');
                renderView();
                checkLock();
            }
        }

        function openLogModal() {
            let activeMonthStr = getActiveMonthString();
            if(!modalSelectedMonth) modalSelectedMonth = activeMonthStr;

            let allMonths = [...new Set(state.transactions.map(t => t.date))];
            
            let selectEl = document.getElementById('modal-month-select');
            selectEl.innerHTML = allMonths.map(m => `<option value="${m}" ${m === modalSelectedMonth ? 'selected' : ''}>${m}</option>`).join('');

            renderModalList();
            document.getElementById('log-modal').style.display = 'flex';
        }

        function changeModalMonth(val) {
            modalSelectedMonth = val;
            renderModalList();
        }

        function renderModalList() {
            let listEl = document.getElementById('log-list');
            let monthTx = state.transactions.filter(t => t.date === modalSelectedMonth);

            listEl.innerHTML = monthTx.length === 0 ? '<p class="text-zinc-500 text-xs text-center py-8">Bu dönem için kayıtlı hareket bulunmuyor.</p>' :
                monthTx.map(t => `
                    <div class="bg-[#121215] border border-zinc-800/80 p-3.5 rounded-2xl flex justify-between items-center">
                        <div>
                            <div class="text-xs text-white font-bold">${t.name} <span class="text-[10px] text-zinc-400">(${t.category})</span></div>
                            <div class="text-[10px] text-zinc-400 mt-0.5">${t.type} · ${t.date}</div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold ${t.type === 'Gelir' ? 'text-[#10b981]' : 'text-[#ef4444]'}">${t.type === 'Gelir' ? '+' : '-'}${t.amount.toLocaleString('tr-TR', {maximumFractionDigits: 0})} ₺</span>
                            <button onclick="closeLogModal(); openEditModal(${t.id})" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-lg text-xs font-semibold">Düzenle</button>
                            <button onclick="deleteTxFromModal(${t.id})" class="w-6 h-6 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 flex items-center justify-center text-xs font-bold">✕</button>
                        </div>
                    </div>
                `).join('');
        }

        function closeLogModal() { document.getElementById('log-modal').style.display = 'none'; }

        function openModal(type) {
            editingTxId = null;
            activeModalType = type;
            document.getElementById('modal-title').innerText = type === 'Gelir' ? `${getActiveMonthString()} - Gelir Ekle` : `${getActiveMonthString()} - Gider Ekle`;
            document.getElementById('m-name').value = '';
            document.getElementById('m-amount').value = '';

            let catSelect = document.getElementById('m-cat');
            if(type === 'Gelir') {
                catSelect.innerHTML = `
                    <option value="Gelir">Gelir / Maaş</option>
                    <option value="Fondan Çek">Fondan Çek</option>
                `;
            } else {
                catSelect.innerHTML = `
                    <option value="Gider">Kredi Kartı / Gider / Kira</option>
                    <option value="Fon Yatırımı">Fon Yatırımı</option>
                `;
            }

            document.getElementById('modal').style.display = 'flex';
        }

        function openEditModal(id) {
            let tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            editingTxId = id;
            activeModalType = tx.type;
            document.getElementById('modal-title').innerText = `${tx.name} - Düzenle`;
            document.getElementById('m-name').value = tx.name;
            document.getElementById('m-amount').value = tx.amount;

            let catSelect = document.getElementById('m-cat');
            if(tx.type === 'Gelir') {
                catSelect.innerHTML = `
                    <option value="Gelir" ${tx.category === 'Gelir' ? 'selected' : ''}>Gelir / Maaş</option>
                    <option value="Fondan Çek" ${tx.category === 'Fondan Çek' ? 'selected' : ''}>Fondan Çek</option>
                `;
            } else {
                catSelect.innerHTML = `
                    <option value="Gider" ${tx.category === 'Gider' ? 'selected' : ''}>Kredi Kartı / Gider / Kira</option>
                    <option value="Fon Yatırımı" ${tx.category === 'Fon Yatırımı' ? 'selected' : ''}>Fon Yatırımı</option>
                `;
            }

            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveModalData() {
            let name = document.getElementById('m-name').value;
            let amount = parseFloat(document.getElementById('m-amount').value);
            let cat = document.getElementById('m-cat').value;
            let type = activeModalType;

            if(!name || isNaN(amount)) { alert('Lütfen geçerli bir isim ve tutar girin.'); return; }

            if(editingTxId !== null) {
                let oldTx = state.transactions.find(t => t.id === editingTxId);
                if(oldTx) {
                    // Eski işlemin fon bakiyesine etkisini geri al
                    if(oldTx.category === 'Fon Yatırımı') state.funds.currentBalance -= oldTx.amount;
                    if(oldTx.category === 'Fondan Çek') state.funds.currentBalance += oldTx.amount;

                    oldTx.name = name;
                    oldTx.amount = amount;
                    oldTx.type = type;
                    oldTx.category = cat;

                    // Yeni işlemin fon bakiyesine etkisini uygula
                    if(cat === 'Fon Yatırımı') state.funds.currentBalance += amount;
                    if(cat === 'Fondan Çek') state.funds.currentBalance -= amount;
                }
            } else {
                state.transactions.push({ id: Date.now(), name, amount, type, category: cat, date: getActiveMonthString() });
                
                // Fon yatırımı / çekimi fon toplam bakiyesini doğrudan etkilesin ve geçmişe eklesin
                let todayStr = new Date().toISOString().split('T')[0];
                if(cat === 'Fon Yatırımı') {
                    state.funds.currentBalance = (state.funds.currentBalance || 0) + amount;
                    state.funds.history.push({ id: Date.now(), date: todayStr, balance: state.funds.currentBalance });
                } else if(cat === 'Fondan Çek') {
                    state.funds.currentBalance = (state.funds.currentBalance || 0) - amount;
                    state.funds.history.push({ id: Date.now(), date: todayStr, balance: state.funds.currentBalance });
                }
            }

            state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
            saveState(); closeModal(); renderView();
        }

        function openPrincipalModal() {
            document.getElementById('p-amount').value = state.funds.principal || 0;
            document.getElementById('principal-modal').style.display = 'flex';
        }

        function closePrincipalModal() {
            document.getElementById('principal-modal').style.display = 'none';
        }

        function savePrincipal() {
            let val = parseFloat(document.getElementById('p-amount').value);
            if(isNaN(val)) { alert('Lütfen geçerli bir tutar girin.'); return; }
            state.funds.principal = val;
            saveState();
            closePrincipalModal();
            renderView();
        }

        function openFundModal() {
            editingHistoryId = null;
            document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('f-balance').value = state.funds.currentBalance || '';
            document.getElementById('fund-modal').style.display = 'flex';
        }

        function openEditFundHistory(id) {
            let h = state.funds.history.find(x => x.id === id);
            if(!h) return;
            editingHistoryId = id;
            document.getElementById('f-date').value = h.date;
            document.getElementById('f-balance').value = h.balance;
            document.getElementById('fund-modal').style.display = 'flex';
        }

        function closeFundModal() { document.getElementById('fund-modal').style.display = 'none'; }

        function saveFundBalance() {
            let dateVal = document.getElementById('f-date').value;
            let newBalance = parseFloat(document.getElementById('f-balance').value);

            if(!dateVal || isNaN(newBalance)) { alert('Lütfen geçerli tarih ve bakiye tutarı girin.'); return; }

            if(!state.funds.history) state.funds.history = [];

            if(editingHistoryId !== null) {
                let h = state.funds.history.find(x => x.id === editingHistoryId);
                if(h) {
                    h.date = dateVal;
                    h.balance = newBalance;
                }
            } else {
                let existing = state.funds.history.find(x => x.date === dateVal);
                if(existing) {
                    existing.balance = newBalance;
                } else {
                    state.funds.history.push({
                        id: Date.now(),
                        date: dateVal,
                        balance: newBalance
                    });
                }
            }

            state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
            let latest = state.funds.history[state.funds.history.length - 1];

            state.funds.currentBalance = latest.balance;

            saveState(); 
            closeFundModal(); 
            renderView();
        }

        function deleteFundHistory(id) {
            if(confirm("Bu fon hareket kaydı silinsin mi?")) {
                state.funds.history = state.funds.history.filter(x => x.id !== id);
                if(state.funds.history.length > 0) {
                    state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
                    let latest = state.funds.history[state.funds.history.length - 1];
                    state.funds.currentBalance = latest.balance;
                } else {
                    state.funds.currentBalance = 0;
                }
                saveState();
                renderView();
            }
        }

        function deleteTx(id) {
            let tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            let txName = tx.name;
            if(confirm(`"${txName}" silinecek. Emin misiniz?`)) {
                if(tx.category === 'Fon Yatırımı') state.funds.currentBalance -= tx.amount;
                if(tx.category === 'Fondan Çek') state.funds.currentBalance += tx.amount;

                state.transactions = state.transactions.filter(t => t.id !== id);
                saveState(); 
                renderView();
            }
        }

        function deleteTxFromModal(id) {
            let tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            let txName = tx.name;
            if(confirm(`"${txName}" silinecek. Emin misiniz?`)) {
                if(tx.category === 'Fon Yatırımı') state.funds.currentBalance -= tx.amount;
                if(tx.category === 'Fondan Çek') state.funds.currentBalance += tx.amount;

                state.transactions = state.transactions.filter(t => t.id !== id);
                saveState(); 
                renderLogModal();
                renderView();
            }
        }

        function resetData() {
            if(confirm("Tüm tablo verileri sıfırlansın mı?")) {
                localStorage.removeItem('cep_butce_excel_v55');
                location.reload();
            }
        }

        // Başlangıç
        checkLock();
        initFirebase();
        renderView();
    </script>
</body>
</html>
