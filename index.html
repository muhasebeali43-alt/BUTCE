    <div id="log-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
        <div class="bg-[#18181c] w-full max-w-lg h-[600px] rounded-3xl border border-zinc-800 p-6 flex flex-col space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Dönem Hareketleri Yönetimi</h3>
                <button onclick="closeLogModal()" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white text-xs">✕</button>
            </div>
            <div>
                <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">Görüntülenecek Ay / Dönem</label>
                <select id="modal-month-select" onchange="changeModalMonth(this.value)" class="w-full bg-[#121215] border border-zinc-800 rounded-2xl p-3 text-white text-sm outline-none focus:border-[#ccff00]">

                </select>
            </div>
            <div id="log-list" class="flex-1 overflow-y-auto no-scrollbar space-y-3 mt-2">

    <div id="report-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden justify-center items-center z-50 p-2 sm:p-6 lg:p-12">
        <div class="bg-[#121215] w-full h-full max-h-[90vh] rounded-[32px] border border-zinc-800 flex flex-col shadow-2xl overflow-hidden">
            <div class="flex justify-between items-center border-b border-zinc-800/80 p-5 sm:p-6 bg-[#18181c] shrink-0">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl">📊</div>
                    <div>
                        <h3 class="text-base sm:text-lg font-extrabold text-white">Finansal Raporlar & Excel Görünümü</h3>
                        <p class="text-xs text-zinc-400 font-medium mt-1">Eylül 2026 hariç, güncel tüm aylar ve kümülatif kasa takibi</p>
                    </div>
                </div>
                <button onclick="closeReportModal()" class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white text-sm transition">✕</button>
            </div>
            
            <div id="report-list" class="flex flex-col flex-1 overflow-y-auto no-scrollbar p-5 sm:p-8 space-y-6">
                <!-- AI Analiz ve Excel Tablosu Buraya Gelecek -->
            </div>
        </div>
    </div>

    <script>
        let savedData = null;
        const allPossibleKeys = ['cep_butce_excel_v84', 'cep_butce_excel_v83', 'cep_butce_excel_v82', 'cep_butce_excel_v81', 'cep_butce_excel_v80', 'cep_butce_excel_v79'];
        
        for (let k of allPossibleKeys) {
            let data = localStorage.getItem(k);
            if (data) {
                try {
                    let parsed = JSON.parse(data);
                    if(parsed && parsed.transactions && parsed.transactions.length > 0) {
                        savedData = parsed;
                        break;
                    }
                } catch(e){}
            }
        }

        if(!savedData) {
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if(key && key.includes('cep_butce')) {
                    try {
                        let parsed = JSON.parse(localStorage.getItem(key));
                        if(parsed && parsed.transactions && parsed.transactions.length > 0) {
                            savedData = parsed;
                            break;
                        }
                    } catch(e){}
                }
            }
        }

        let state = savedData || {
            transactions: [],
            funds: { currentBalance: 762000, principal: 761167, history: [{ id: Date.now(), date: "2026-09-24", balance: 762000 }] },
            pin: "",
            lastUpdated: Date.now()
        };

        if(!state.funds) {
            state.funds = { currentBalance: 762000, principal: 761167, history: [] };
        }
        if(state.funds.principal === undefined) state.funds.principal = 761167;
        if(!state.funds.history) state.funds.history = [];
        if(state.funds.history.length === 0) {
            state.funds.history.push({
                id: Date.now(),
                date: "2026-09-24",
                balance: state.funds.currentBalance || 762000
            });
        }

        if(!state.lastUpdated) state.lastUpdated = Date.now();

        // Firebase Firestore Otomatik Entegrasyonu
        const firebaseConfig = {
            apiKey: "AIzaSyCLxx02KpBH2MFGXEePIb-w79FVwOBW4GQ",
            authDomain: "butce-24f0f.firebaseapp.com",
            projectId: "butce-24f0f",
            storageBucket: "butce-24f0f.appspot.com",
            messagingSenderId: "202707791257",
            appId: "1:202707791257:web:694f4e63831630e0eab708"
        };

        let db = null;
        let isSyncingFromCloud = false;
        let inactivityTimer = null;
        const INACTIVITY_TIME = 3 * 60 * 1000;

        function resetInactivityTimer() {
            if (!state.pin || !sessionStorage.getItem('cep_unlocked')) return;
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                lockApp();
            }, INACTIVITY_TIME);
        }

        ['mousemove', 'mousedown', 'keypress', 'touchstart', 'scroll', 'click'].forEach(evt => {
            window.addEventListener(evt, resetInactivityTimer, true);
        });

        function checkLock() {
            let lockScreen = document.getElementById('lock-screen');
            if(!lockScreen) return;
            if(state.pin && !sessionStorage.getItem('cep_unlocked')) {
                lockScreen.classList.remove('hidden');
                lockScreen.style.display = 'flex';
                clearTimeout(inactivityTimer);
            } else {
                lockScreen.classList.add('hidden');
                lockScreen.style.display = 'none';
                resetInactivityTimer();
            }
            updateTopLockBtn();
        }

        function lockApp() {
            sessionStorage.removeItem('cep_unlocked');
            clearTimeout(inactivityTimer);
            checkLock();
        }

        function updateTopLockBtn() {
            let container = document.getElementById('top-lock-btn-container');
            if(!container) return;
            if(state.pin) {
                container.innerHTML = `
                    <button onclick="lockApp()" class="hidden sm:flex items-center space-x-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-4 py-2 rounded-2xl border border-amber-500/20 text-xs font-bold transition shadow-sm" title="Kilitle / Çıkış Yap">
                        <span>🔒 Kilitle</span>
                    </button>
                `;
            } else {
                container.innerHTML = '';
            }
        }

        function initFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                
                db.collection("cepButce").doc("anaVeri").get().then((doc) => {
                    if (doc.exists) {
                        let cloudData = doc.data();
                        if (cloudData && cloudData.transactions && cloudData.transactions.length >= state.transactions.length) {
                            state = cloudData;
                            if(!state.funds) state.funds = { currentBalance: 762000, principal: 761167, history: [] };
                            if(state.funds.principal === undefined) state.funds.principal = 761167;
                            if(!state.funds.history) state.funds.history = [];
                            if(state.funds.history.length === 0) {
                                state.funds.history.push({
                                    id: Date.now(),
                                    date: "2026-09-24",
                                    balance: state.funds.currentBalance || 762000
                                });
                            }
                            localStorage.setItem('cep_butce_excel_v84', JSON.stringify(state));
                            checkLock();
                            renderView();
                        } else {
                            db.collection("cepButce").doc("anaVeri").set(state);
                        }
                    } else {
                        db.collection("cepButce").doc("anaVeri").set(state);
                    }
                }).catch(e => {});

                db.collection("cepButce").doc("anaVeri").onSnapshot((doc) => {
                    let statusEl = document.getElementById('sync-status');
                    if (doc.exists) {
                        let cloudData = doc.data();
                        if (statusEl) {
                            statusEl.innerText = "Canlı Bağlı";
                            statusEl.className = "text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 transition ml-2";
                        }
                        if (cloudData && cloudData.transactions && cloudData.transactions.length > state.transactions.length) {
                            isSyncingFromCloud = true;
                            state = cloudData;
                            if(!state.funds) state.funds = { currentBalance: 762000, principal: 761167, history: [] };
                            if(state.funds.principal === undefined) state.funds.principal = 761167;
                            if(!state.funds.history) state.funds.history = [];
                            if(state.funds.history.length === 0) {
                                state.funds.history.push({
                                    id: Date.now(),
                                    date: "2026-09-24",

            appView.dataset.swipeInit = 'true';

            appView.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            appView.addEventListener('touchend', (e) => {
                let touchEndX = e.changedTouches[0].screenX;
                let touchEndY = e.changedTouches[0].screenY;
                let diffX = touchEndX - touchStartX;
                let diffY = touchEndY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 80) {
                    let currentIndex = tabOrder.indexOf(currentTab);
                    if (diffX > 0 && currentIndex > 0) {
                        changeTab(tabOrder[currentIndex - 1]);

                }
            }, { passive: true });

            return year * 12 + mIndex;

            let monthsSet = new Set(state.transactions.map(t => t.date));

            let arr = Array.from(monthsSet);
            arr.sort((a, b) => parseMonthYear(a) - parseMonthYear(b));
            return arr;
        }

        function calculateMonthFinancials(targetMonthStr) {
            let chronoMonths = getChronologicalMonths();
            let targetIndex = chronoMonths.indexOf(targetMonthStr);
            
            let devredenBakiye = 0;
            let buAyGelir = 0;
            let buAyGider = 0;
            
            let runningBalance = 0;
            for (let i = 0; i <= targetIndex; i++) {
                let mStr = chronoMonths[i];
                let mTx = state.transactions.filter(t => t.date === mStr);
                let g = mTx.filter(t => t.type === 'Gelir').reduce((a, b) => a + b.amount, 0);
                let d = mTx.filter(t => t.type === 'Gider').reduce((a, b) => a + b.amount, 0);
                let mNet = g - d;
                
                if (i < targetIndex) {
                    runningBalance += mNet;
                } else {
                    devredenBakiye = runningBalance;
                    buAyGelir = g;
                    buAyGider = d;
                }
            }
            
            let toplamBakiye = devredenBakiye + buAyGelir - buAyGider;
            return { devredenBakiye, buAyGelir, buAyGider, toplamBakiye };
        }

        function formatDateToMonthStr(dateStr) {

            if(parts.length === 3) {

            return dateStr;

        function openReportModal() {
            let chronoMonths = getChronologicalMonths();
            let displayMonths = chronoMonths.filter(m => m !== 'Eylül 2026');
            let listEl = document.getElementById('report-list');
            
            let currentBal = 0, expectedBal = 0;
            let allEvents = [];
            (state.funds.history || []).forEach(h => allEvents.push({ type: 'update', time: h.id, val: h.balance }));
            (state.transactions || []).filter(t => t.category === 'Fon Yatırımı' || t.category === 'Fondan Çek').forEach(t => {
                if (t.category === 'Fon Yatırımı') allEvents.push({ type: 'invest', time: t.id, val: t.amount });
                if (t.category === 'Fondan Çek') allEvents.push({ type: 'withdraw', time: t.id, val: t.amount });
            });
            allEvents.sort((a, b) => a.time - b.time);
            
            allEvents.forEach(e => {
                if (e.type === 'update') { currentBal = e.val; expectedBal = e.val; }
                else if (e.type === 'invest') { currentBal += e.val; expectedBal += e.val; }
                else if (e.type === 'withdraw') { currentBal -= e.val; expectedBal -= e.val; }
            });
            
            let basePrincipal = state.funds.principal !== undefined ? state.funds.principal : 761167;
            let totalInvested = state.transactions.filter(t => t.category === 'Fon Yatırımı').reduce((a,b) => a + b.amount, 0);
            let totalWithdrawn = state.transactions.filter(t => t.category === 'Fondan Çek').reduce((a,b) => a + b.amount, 0);
            let principal = basePrincipal + totalInvested - totalWithdrawn;
            let fonTotal = currentBal;
            let toplamKar = fonTotal - principal;
            
            let aySayisi = displayMonths.length > 0 ? displayMonths.length : 1;
            let aylikOrtalamaGetiri = Math.round(toplamKar / aySayisi);
            
            let yonlendirmeMetni = "";
            if(aylikOrtalamaGetiri > 0) {
                yonlendirmeMetni = `Fondan elde ettiğin toplam kâr <b class="text-white">${toplamKar.toLocaleString('tr-TR')} ₺</b>. Eksik girilen ilk ay (Eylül) hesaptan çıkarıldığında fonların sana aktif aylarda ortalama <b class="text-emerald-400">+${aylikOrtalamaGetiri.toLocaleString('tr-TR')} ₺</b> getiri sağladığı görülüyor. Bu başarılı pasif geliri sabit giderlerini hafifletmek veya anaparaya ekleyerek büyütmek için kullanabilirsin.`;
            } else if (aylikOrtalamaGetiri < 0) {
                yonlendirmeMetni = `Fon tarafında şu an <b class="text-white">${toplamKar.toLocaleString('tr-TR')} ₺</b> eksidesin (Eylül hariç ortalama <b class="text-red-400">${aylikOrtalamaGetiri.toLocaleString('tr-TR')} ₺</b> düşüş). Piyasayı izleyip aceleci davranmamanı tavsiye ederim.`;
            } else {
                yonlendirmeMetni = `Henüz fon tarafında net bir kâr/zarar oluşmamış. Düzenli yatırımlara devam ederek büyüme başlatabilirsin.`;
            }

            let html = `
                <div class="bg-gradient-to-br from-indigo-900/40 to-purple-900/20 border border-indigo-500/30 rounded-3xl p-6 lg:p-8 shrink-0 shadow-lg">
                    <div class="flex items-center space-x-3 mb-4">
                        <span class="text-indigo-400 text-2xl">💡</span>
                        <h4 class="text-sm font-extrabold text-indigo-300 uppercase tracking-widest">CepteBütçe Akıllı Fon Analizi</h4>
                    </div>
                    <p class="text-sm leading-relaxed text-zinc-300">${yonlendirmeMetni}</p>
                </div>
            `;

            if (displayMonths.length === 0) {
                html += '<p class="text-zinc-500 text-sm w-full text-center py-10 mt-6">Henüz Ekim 2026 ve sonrası için raporlanacak kayıt bulunmuyor.</p>';
            } else {
                let gelirNames = [...new Set(state.transactions.filter(t => t.type === 'Gelir' || t.category === 'Fondan Çek').map(t => t.name))];
                let giderNames = [...new Set(state.transactions.filter(t => t.type === 'Gider' || t.category === 'Fon Yatırımı').map(t => t.name))];

                html += `
                <div class="flex items-center justify-between px-2 mt-4 mb-2 shrink-0">
                    <h4 class="text-sm font-bold text-zinc-400 uppercase tracking-wider">Detaylı Excel Görünümü</h4>
                    <span class="text-xs text-zinc-500 bg-zinc-800/50 px-3 py-1 rounded-full">Sağa doğru kaydırın ➡</span>
                </div>
                
                <div class="overflow-x-auto border border-zinc-800/80 rounded-3xl bg-[#121215] no-scrollbar pb-4 shrink-0 shadow-xl">
                    <table class="w-full text-left border-collapse text-xs sm:text-sm whitespace-nowrap min-w-max">
                        <thead>
                            <tr>
                                <th class="p-4 sm:p-5 border-b border-r border-zinc-800 bg-[#1a1a20] text-white font-extrabold sticky-col uppercase tracking-widest text-[11px] sm:text-xs">Tarih / Kalem</th>
                                ${displayMonths.map(m => `<th class="p-4 sm:p-5 border-b border-zinc-800 text-center text-[#ccff00] font-extrabold text-xs sm:text-sm tracking-wide">${m.toUpperCase()}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                `;

                gelirNames.forEach(name => {
                    html += `<tr class="hover:bg-zinc-800/40 transition">
                        <td class="p-4 sm:p-5 border-b border-r border-zinc-800/50 bg-[#18181c] text-zinc-300 font-semibold sticky-col">${name}</td>`;
                    displayMonths.forEach(mStr => {
                        let val = state.transactions.filter(t => t.date === mStr && t.name === name).reduce((a,b)=>a+b.amount,0);
                        html += `<td class="p-4 sm:p-5 border-b border-zinc-800/50 text-right ${val > 0 ? 'text-[#10b981] font-medium' : 'text-zinc-600'}">${val > 0 ? val.toLocaleString('tr-TR') : '-'}</td>`;
                    });
                    html += `</tr>`;
                });

                giderNames.forEach(name => {
                    html += `<tr class="hover:bg-zinc-800/40 transition">
                        <td class="p-4 sm:p-5 border-b border-r border-zinc-800/50 bg-[#18181c] text-zinc-300 font-semibold sticky-col">${name}</td>`;
                    displayMonths.forEach(mStr => {
                        let val = state.transactions.filter(t => t.date === mStr && t.name === name).reduce((a,b)=>a+b.amount,0);
                        html += `<td class="p-4 sm:p-5 border-b border-zinc-800/50 text-right ${val > 0 ? 'text-[#ef4444] font-medium' : 'text-zinc-600'}">${val > 0 ? '-'+val.toLocaleString('tr-TR') : '-'}</td>`;
                    });
                    html += `</tr>`;
                });

                html += `<tr>
                    <td class="p-4 sm:p-5 bg-[#1a1a20] text-white font-extrabold sticky-col border-t border-r border-zinc-700 tracking-wide">AYLIK KALAN</td>`;
                displayMonths.forEach(mStr => {
                    let mTx = state.transactions.filter(t => t.date === mStr);
                    let g = mTx.filter(t => t.type === 'Gelir').reduce((a, b) => a + b.amount, 0);
                    let d = mTx.filter(t => t.type === 'Gider').reduce((a, b) => a + b.amount, 0);
                    let mNet = g - d;
                    let color = mNet >= 0 ? 'text-white' : 'text-red-400';
                    html += `<td class="p-4 sm:p-5 text-right font-extrabold border-t border-zinc-700 bg-zinc-800/30 text-sm sm:text-base ${color}">${mNet.toLocaleString('tr-TR')}</td>`;
                });
                html += `</tr>`;

                html += `<tr>
                    <td class="p-4 sm:p-5 bg-[#1a1a20] text-[#ccff00] font-extrabold sticky-col border-r border-zinc-700 shadow-[0_-2px_15px_rgba(204,255,0,0.08)] tracking-wide">DEVREDEN KASA</td>`;
                
                let runningBalance = 0;
                chronoMonths.forEach(mStr => {
                    let mTx = state.transactions.filter(t => t.date === mStr);
                    let g = mTx.filter(t => t.type === 'Gelir').reduce((a, b) => a + b.amount, 0);
                    let d = mTx.filter(t => t.type === 'Gider').reduce((a, b) => a + b.amount, 0);
                    let mNet = g - d;
                    runningBalance += mNet;

                    if (mStr !== 'Eylül 2026') {
                        let color = runningBalance >= 0 ? 'text-[#ccff00]' : 'text-red-400';
                        html += `<td class="p-4 sm:p-5 text-right font-extrabold bg-[#ccff00]/10 text-sm sm:text-base ${color}">${runningBalance.toLocaleString('tr-TR')} ₺</td>`;
                    }
                });
                html += `</tr>`;

                html += `</tbody></table></div>`;
            }

            listEl.innerHTML = html;
            document.getElementById('report-modal').style.display = 'flex';
        }

        function saveModalData() {
            let name = document.getElementById('m-name').value;
            let amount = parseFloat(document.getElementById('m-amount').value);
            let cat = document.getElementById('m-cat').value;
            let type = activeModalType;

            if(!name || isNaN(amount)) { alert('Lütfen geçerli bir isim ve tutar girin.'); return; }

            if(editingTxId !== null) {
                let oldTx = state.transactions.find(t => t.id === editingTxId);
                if(oldTx) {
                    oldTx.name = name;
                    oldTx.amount = amount;
                    oldTx.type = type;
                    oldTx.category = cat;
                }
            } else {
                state.transactions.push({ id: Date.now(), name, amount, type, category: cat, date: getActiveMonthString() });
            }

            saveState(); closeModal(); renderView();
        }

        function openPrincipalModal() {
            let totalInvested = state.transactions.filter(t => t.category === 'Fon Yatırımı').reduce((a,b) => a + b.amount, 0);
            let totalWithdrawn = state.transactions.filter(t => t.category === 'Fondan Çek').reduce((a,b) => a + b.amount, 0);
            let currentPrincipal = (state.funds.principal !== undefined ? state.funds.principal : 761167) + totalInvested - totalWithdrawn;
            
            document.getElementById('p-amount').value = currentPrincipal;
            document.getElementById('principal-modal').style.display = 'flex';
        }

        function closePrincipalModal() {
            document.getElementById('principal-modal').style.display = 'none';
        }

        function savePrincipal() {
            let val = parseFloat(document.getElementById('p-amount').value);
            if(isNaN(val)) { alert('Lütfen geçerli bir tutar girin.'); return; }
            
            let totalInvested = state.transactions.filter(t => t.category === 'Fon Yatırımı').reduce((a,b) => a + b.amount, 0);
            let totalWithdrawn = state.transactions.filter(t => t.category === 'Fondan Çek').reduce((a,b) => a + b.amount, 0);
            
            state.funds.principal = val - totalInvested + totalWithdrawn;
            
            saveState();
            closePrincipalModal();
            renderView();
        }

        function openFundModal() {
            editingHistoryId = null;
            document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
            let historyList = state.funds.history || [];
            let latestBalance = historyList.length > 0 ? historyList[historyList.length - 1].balance : 762000;
            document.getElementById('f-balance').value = latestBalance;
            document.getElementById('fund-modal').style.display = 'flex';
        }

        function openEditFundHistory(id) {
            let h = state.funds.history.find(x => x.id === id);
            if(!h) return;
            editingHistoryId = id;
            document.getElementById('f-date').value = h.date;
            document.getElementById('f-balance').value = h.balance;
            document.getElementById('fund-modal').style.display = 'flex';
        }

        function closeFundModal() { document.getElementById('fund-modal').style.display = 'none'; }

        function saveFundBalance() {
            let dateVal = document.getElementById('f-date').value;
            let newBalance = parseFloat(document.getElementById('f-balance').value);

            if(!dateVal || isNaN(newBalance)) { alert('Lütfen geçerli tarih ve bakiye tutarı girin.'); return; }

            if(!state.funds.history) state.funds.history = [];

            if(editingHistoryId !== null) {
                let h = state.funds.history.find(x => x.id === editingHistoryId);
                if(h) {
                    h.date = dateVal;
                    h.balance = newBalance;
                }
            } else {
                let existing = state.funds.history.find(x => x.date === dateVal);
                if(existing) {
                    existing.balance = newBalance;
                } else {
                    state.funds.history.push({
                        id: Date.now(),
                        date: dateVal,
                        balance: newBalance
                    });
                }
            }

            state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
            let latest = state.funds.history[state.funds.history.length - 1];

            state.funds.currentBalance = latest.balance;

            saveState(); 
            closeFundModal(); 
            renderView();
        }

        function deleteFundHistory(id) {
            if(confirm("Bu fon hareket kaydı silinsin mi?")) {
                state.funds.history = state.funds.history.filter(x => x.id !== id);
                if(state.funds.history.length > 0) {
                    state.funds.history.sort((a, b) => new Date(a.date) - new Date(b.date));
                    let latest = state.funds.history[state.funds.history.length - 1];
                    state.funds.currentBalance = latest.balance;
                } else {
                    state.funds.currentBalance = 0;
                }
                saveState();
                renderView();
            }
        }

        function deleteTx(id) {
            let tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            let txName = tx.name;
            if(confirm(`"${txName}" silinecek. Emin misiniz?`)) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveState(); 
                renderView();
            }
        }

        function deleteTxFromModal(id) {
            let tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            let txName = tx.name;
            if(confirm(`"${txName}" silinecek. Emin misiniz?`)) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveState(); 
                renderLogModal();
                renderView();
            }
        }

        function resetData() {
            if(confirm("Tüm tablo verileri sıfırlansın mı?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Başlangıç
        checkLock();
        initFirebase();
        renderView();
    </script>
</body>
</html>
