            <div class="w-full max-w-xs space-y-3">

            <div class="flex items-center space-x-2.5 bg-[#18181c] px-3 py-1.5 rounded-2xl border border-zinc-800">

            </div>
        </div>

                            <!-- Gizli Kod ile Eşitleme -->
                            <div class="space-y-2.5 pb-4 border-b border-zinc-800">
                                <span class="text-xs sm:text-sm font-bold text-white block">🔑 Ortak Senkronizasyon Kodunuz</span>
                                <p class="text-[10px] text-zinc-400">Telefonunuzda ve bilgisayarınızda aynı gizli kodu (örneğin adınız) yazın; iki cihaz bulutta otomatik olarak birbirine bağlansın.</p>
                                <div class="flex space-x-2 pt-1">
                                    <input type="text" id="setting-sync-key" value="${currentSyncCode}" placeholder="Örn: alicengiz" class="flex-1 bg-[#121215] border border-zinc-800 rounded-xl p-3 text-white text-xs outline-none focus:border-[#ccff00]">
                                    <button onclick="saveSyncKey()" class="bg-[#ccff00] text-black font-bold px-4 py-3 rounded-xl text-xs hover:bg-[#b3e600]">Bağla</button>
                                </div>
                            </div>

                            <div class="space-y-2.5 pb-4 border-b border-zinc-800">
                                <span class="text-xs sm:text-sm font-bold text-white block">Uygulama Şifresi</span>
                                <div class="flex space-x-2">
                                    <input type="password" id="setting-pin" placeholder="${state.pin ? 'Yeni şifre' : 'Şifre koy'}" maxlength="6" class="flex-1 bg-[#121215] border border-zinc-800 rounded-xl p-2.5 text-white text-xs outline-none focus:border-[#ccff00]">
                                    <button onclick="savePinSetting()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold px-3.5 py-2.5 rounded-xl text-xs">Kaydet</button>
                                </div>
                                ${state.pin ? '<button onclick="removePin()" class="text-red-400 text-[11px] font-semibold hover:underline">Şifreyi Kaldır</button>' : ''}
                            </div>

                            <div class="flex justify-between items-center py-2 border-b border-zinc-800">
                                <span class="text-xs sm:text-sm font-medium text-white">Dönem Hareketleri (Tüm Aylar)</span>
                                <button onclick="openLogModal()" class="bg-purple-500/10 text-purple-400 text-[11px] font-bold px-3.5 py-2 rounded-xl">Yönet / Gör</button>
                            </div>

                            <div class="flex justify-between items-center py-2">
                                <span class="text-xs sm:text-sm font-medium text-white">Tablo Verilerini Sıfırla</span>
                                <button onclick="resetData()" class="bg-red-500/10 text-red-400 text-[11px] font-bold px-3.5 py-2 rounded-xl">Sıfırla</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function saveSyncKey() {
            let val = document.getElementById('setting-sync-key').value.trim();
            if(!val) { alert('Lütfen geçerli bir kod girin.'); return; }
            localStorage.setItem('cep_sync_key', val);
            state.syncKey = val;
            localStorage.removeItem('cep_bin_' + val); // Yeni kutu oluşturulacak
            saveState();
            alert('Senkronizasyon kodu kaydedildi! Şimdi bu kodu diğer cihazınıza da yazarak eşitleyebilirsiniz.');
            renderView();
        }

        function savePinSetting() {
            let val = document.getElementById('setting-pin').value;
            if(!val) { alert('Lütfen bir şifre girin.'); return; }
            state.pin = val;
            saveState();
            alert('Şifre başarıyla kaydedildi!');
            renderView();
        }

        function removePin() {
            if(confirm("Uygulama şifresi kaldırılsın mı?")) {
                state.pin = "";
                saveState();
                alert('Şifre kaldırıldı.');
                renderView();
            }
        }

        function openLogModal() {
            let activeMonthStr = getActiveMonthString();
            if(!modalSelectedMonth) modalSelectedMonth = activeMonthStr;

            let allMonths = [...new Set(state.transactions.map(t => t.date))];
            
            let selectEl = document.getElementById('modal-month-select');
            selectEl.innerHTML = allMonths.map(m => `<option value="${m}" ${m === modalSelectedMonth ? 'selected' : ''}>${m}</option>`).join('');

            renderModalList();
            document.getElementById('log-modal').style.display = 'flex';
        }

        function changeModalMonth(val) {
            modalSelectedMonth = val;
            renderModalList();
        }

        function renderModalList() {
            let listEl = document.getElementById('log-list');
            let monthTx = state.transactions.filter(t => t.date === modalSelectedMonth);

            listEl.innerHTML = monthTx.length === 0 ? '<p class="text-zinc-500 text-xs text-center py-8">Bu dönem için kayıtlı hareket bulunmuyor.</p>' :
                monthTx.map(t => `
                    <div class="bg-[#121215] border border-zinc-800/80 p-3 rounded-2xl flex justify-between items-center">
                        <div>
                            <div class="text-[11px] text-white font-bold">${t.name} <span class="text-[9px] text-zinc-400">(${t.category})</span></div>
                            <div class="text-[9px] text-zinc-400 mt-0.5">${t.type} · ${t.date}</div>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[11px] font-bold ${t.type === 'Gelir' ? 'text-[#10b981]' : 'text-[#ef4444]'}">${t.type === 'Gelir' ? '+' : '-'}${t.amount.toLocaleString('tr-TR')} ₺</span>
                            <button onclick="closeLogModal(); openEditModal(${t.id})" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-0.5 rounded-lg text-[10px] font-semibold">Düzenle</button>
                            <button onclick="deleteTxFromModal(${t.id})" class="w-5 h-5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 flex items-center justify-center text-[10px] font-bold">✕</button>
                        </div>
                    </div>
                `).join('');
        }

        function closeLogModal() { document.getElementById('log-modal').style.display = 'none'; }

        function openModal(type) {
            editingTxId = null;
            activeModalType = type;
            document.getElementById('modal-title').innerText = type === 'Gelir' ? `${getActiveMonthString()} - Gelir Ekle` : `${getActiveMonthString()} - Gider Ekle`;
            document.getElementById('m-name').value = '';
            document.getElementById('m-amount').value = '';

            let catSelect = document.getElementById('m-cat');
            if(type === 'Gelir') {
                catSelect.innerHTML = `
                    <option value="Gelir">Gelir / Maaş</option>
                    <option value="Fondan Çek">Fondan Çek</option>
                `;
            } else {
                catSelect.innerHTML = `
                    <option value="Gider">Kredi Kartı / Gider / Kira</option>
                    <option value="Fon Yatırımı">Fon Yatırımı</option>
                `;
            }

            document.getElementById('modal').style.display = 'flex';
        }

        function openEditModal(id) {
            let tx = state.transactions.find(t => t.id === id);
            if(!tx) return;
            editingTxId = id;
            activeModalType = tx.type;
            document.getElementById('modal-title').innerText = `${tx.name} - Düzenle`;
            document.getElementById('m-name').value = tx.name;
            document.getElementById('m-amount').value = tx.amount;

            let catSelect = document.getElementById('m-cat');
            if(tx.type === 'Gelir') {
                catSelect.innerHTML = `
                    <option value="Gelir" ${tx.category === 'Gelir' ? 'selected' : ''}>Gelir / Maaş</option>
                    <option value="Fondan Çek" ${tx.category === 'Fondan Çek' ? 'selected' : ''}>Fondan Çek</option>
                `;
            } else {
                catSelect.innerHTML = `
                    <option value="Gider" ${tx.category === 'Gider' ? 'selected' : ''}>Kredi Kartı / Gider / Kira</option>
                    <option value="Fon Yatırımı" ${tx.category === 'Fon Yatırımı' ? 'selected' : ''}>Fon Yatırımı</option>
                `;
            }

            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveModalData() {
            let name = document.getElementById('m-name').value;
            let amount = parseFloat(document.getElementById('m-amount').value);
            let cat = document.getElementById('m-cat').value;
            let type = activeModalType;

            if(!name || isNaN(amount)) { alert('Lütfen geçerli bir isim ve tutar girin.'); return; }

            if(editingTxId !== null) {
                let oldTx = state.transactions.find(t => t.id === editingTxId);
                if(oldTx) {
                    oldTx.name = name;
                    oldTx.amount = amount;
                    oldTx.type = type;
                    oldTx.category = cat;
                }
            } else {
                state.transactions.push({ id: Date.now(), name, amount, type, category: cat, date: getActiveMonthString() });
            }

            saveState(); closeModal(); renderView();
        }

        function openFundModal() {
            document.getElementById('f-balance').value = state.funds.currentBalance || '';
            document.getElementById('f-principal').value = state.funds.principal !== undefined ? state.funds.principal : (state.funds.currentBalance || '');
            document.getElementById('fund-modal').style.display = 'flex';
        }

        function closeFundModal() { document.getElementById('fund-modal').style.display = 'none'; }

        function saveFundBalance() {
            let newBalance = parseFloat(document.getElementById('f-balance').value);
            let newPrincipal = parseFloat(document.getElementById('f-principal').value);

            if(isNaN(newBalance) || isNaN(newPrincipal)) { alert('Lütfen geçerli tutarlar girin.'); return; }

            state.funds.previousBalance = state.funds.currentBalance !== undefined ? state.funds.currentBalance : newBalance;
            state.funds.currentBalance = newBalance;
            state.funds.principal = newPrincipal;

            saveState(); closeFundModal(); renderView();
        }

        // Silme işlemine onay uyarısı
        function deleteTx(id) {
            let tx = state.transactions.find(t => t.id === id);
            let txName = tx ? tx.name : "Bu işlemi";
            if(confirm(`"${txName}" silinecek. Emin misiniz?`)) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveState(); 
                renderView();
            }
        }

        function deleteTxFromModal(id) {
            let tx = state.transactions.find(t => t.id === id);
            let txName = tx ? tx.name : "Bu işlemi";
            if(confirm(`"${txName}" silinecek. Emin misiniz?`)) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveState(); 
                renderModalList();
                renderView();
            }
        }

        function resetData() {
            if(confirm("Tüm tablo verileri sıfırlansın mı?")) {
                localStorage.removeItem('cep_butce_excel_v18');
                let key = localStorage.getItem('cep_sync_key') || "alicengiz2026";
                localStorage.removeItem('cep_bin_' + key);
                location.reload();
            }
        }

        // Başlangıç ve Otomatik Senkronizasyon Döngüsü
        async function initApp() {
            checkLock();
            await pushToCloud();
            renderView();
            // Her 4 saniyede bir arkada sessizce eşitler
            setInterval(backgroundAutoSync, 4000);
        }

        initApp();
    </script>
</body>
</html>
